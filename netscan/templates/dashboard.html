<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NetScan-Lite Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="masthead">
    <h1>NetScan-Lite</h1>
    <p class="tagline">Educational TCP port scanner &mdash; loopback and private lab only</p>
  </header>

  <main class="card">
    <form id="scan-form" novalidate>
      <fieldset>
        <legend>Scan configuration</legend>

        <label class="field-row">
          <span class="field-label">Target (IP address)</span>
          <input class="field-input" name="target" type="text" inputmode="numeric" placeholder="127.0.0.1" autocomplete="off" />
          <span class="help" id="target-help"></span>
        </label>

        <label class="field-row">
          <span class="field-label">Ports</span>
          <input class="field-input" name="ports" type="text" placeholder="e.g. 22,80-81,443" autocomplete="off" />
          <span class="help" id="ports-help"></span>
        </label>

        <label class="field-row">
          <span class="field-label">Timeout (seconds)</span>
          <input class="field-input" name="timeout" type="number" step="0.1" min="0.1" value="1.0" />
          <span class="help" id="timeout-help"></span>
        </label>

        <div class="field-actions">
          <button type="submit" id="start-btn" disabled>Start scan</button>
          <button type="button" id="validate-btn">Validate only</button>
          <button type="button" id="clear-btn">Clear</button>
        </div>
        <p class="notice" id="scan-notice"></p>
      </fieldset>
    </form>

    <section class="results hidden" id="results-area">
      <div class="results-head">
        <div class="results-summary">
          <h2 id="results-title">Scan results</h2>
          <p id="results-meta"></p>
        </div>
        <div class="results-actions">
          <button type="button" id="export-json" class="btn-small">Export JSON</button>
          <button type="button" id="export-csv" class="btn-small">Export CSV</button>
        </div>
      </div>
      <div class="scroll" id="results-table-wrap">
        <table id="results-table">
          <thead>
            <tr>
              <th>Port</th>
              <th>Service</th>
              <th>State</th>
              <th>Error</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <pre id="results-raw" class="hidden"></pre>
    </section>
  </main>

  <p class="footer">
    TCP connect scan only. Port numbers are hints, not proof of service.
    This app does not store any data.
  </p>

  <script src="/static/app.js"></script>
</body>
</html>
